# Build : d'abord le backend (pour Prisma + dist), puis le frontend
[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

# Variables d'environnement pour le build (optionnel)
[build.environment]
  NODE_VERSION = "20"

# Redirection : /api/* vers la fonction en conservant le chemin (/api/...)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

# SPA : toute autre route sert index.html (refresh sur /r/xxx, /restaurant/xxx, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

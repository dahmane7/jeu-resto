# Build : d'abord le backend (pour Prisma + dist), puis le frontend
[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

# Variables d'environnement pour le build (optionnel)
[build.environment]
  NODE_VERSION = "20"

# Pas de redirection /api/* : le front appelle directement /.netlify/functions/server (voir VITE_API_URL ci‑dessous)

# SPA : toute autre route sert index.html (refresh sur /r/xxx, /restaurant/xxx, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
